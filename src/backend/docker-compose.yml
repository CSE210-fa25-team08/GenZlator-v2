version: '3.8'

services:
  backend:
    build:
      context: ../..  # Point to repo root (where Dockerfile expects to build from)
      dockerfile: src/backend/Dockerfile  # Path to Dockerfile from root
    ports:
      - "8001:8001"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FEEDBACK_LOG_PATH=${FEEDBACK_LOG_PATH:-feedback_log.jsonl}
    volumes:
      # Mount feedback log directory for persistence
      - ./api:/app/src/backend/api  
    restart: unless-stopped
