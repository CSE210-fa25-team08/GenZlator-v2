services:
  backend:
    # Pull image from Google Artifact Registry
    image: us-west1-docker.pkg.dev/genzlator-478301/genzimage/genzlator-backend:latest
    
    ports:
      - "8003:8003"
    
    env_file:
      - .env
    
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FEEDBACK_LOG_PATH=${FEEDBACK_LOG_PATH:-feedback_log.jsonl}
      - RAG_DATABASE_URL=${RAG_DATABASE_URL:-sqlite:///feedback_embeddings.db}
    
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true          # Remove old images after update
      - WATCHTOWER_REMOVE_VOLUMES=false  
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_STOPPED=false # Only update running containers
    restart: unless-stopped
    command: --label-enable --interval 60 --cleanup